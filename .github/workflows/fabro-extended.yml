name: fabro-extended

# Builds the extended Fabro runtime image (docker/fabro-extended/Dockerfile):
# the latest STABLE Fabro release + bash and common CLI tools, published to this
# fork's GHCR namespace as a public package. Rebuilt weekly so it tracks new
# stable releases and picks up fresh tool/security updates.
#
# NOTE: scheduled (cron) runs only fire on the repository's DEFAULT branch, so
# this workflow must live on the fork's default branch for the weekly build to
# trigger. The manual "Run workflow" button (workflow_dispatch) works any time.
#
# One-time setup: after the first push, set the package
# ghcr.io/<owner>/fabro-extended visibility to Public in the package settings
# (Packages -> fabro-extended -> Package settings -> Change visibility) so it can
# be pulled anonymously.

on:
  schedule:
    - cron: "0 6 * * 0"   # every Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      fabro_version:
        description: "Fabro stable version to base on (blank = auto-resolve latest stable)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fabro-extended
  DOCKERFILE: docker/fabro-extended/Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest stable Fabro version
        id: ver
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.fabro_version }}"
          if [ -z "$V" ]; then
            TOK=$(curl -fsSL "https://ghcr.io/token?scope=repository:fabro-sh/fabro:pull&service=ghcr.io" | jq -r .token)
            V=$(curl -fsSL -H "Authorization: Bearer $TOK" "https://ghcr.io/v2/fabro-sh/fabro/tags/list?n=1000" \
                  | jq -r '.tags[]' \
                  | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                  | sort -V | tail -1)
          fi
          [ -n "$V" ] || { echo "::error::could not resolve a stable fabro version"; exit 1; }
          echo "Resolved stable Fabro version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (load locally for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          build-args: |
            FABRO_VERSION=${{ steps.ver.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci-smoke

      - name: Smoke test (bash + tools + fabro present)
        run: |
          docker run --rm --entrypoint bash "${{ env.IMAGE }}:ci-smoke" -lc '
            set -e
            echo "bash: $(bash --version | head -1)"
            for t in bash curl jq dig nslookup git fabro; do
              if command -v "$t" >/dev/null 2>&1; then echo "ok: $t"; else echo "MISSING: $t"; exit 1; fi
            done
          '

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          build-args: |
            FABRO_VERSION=${{ steps.ver.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.date }}
